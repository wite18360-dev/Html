<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 For Faiza — Premium</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #ffd700;
    --gold-deep: #b8860b;
    --rose: #ff4d8d;
    --rose-soft: #ff85a1;
    --deep: #2a0a1f;
    --deep2: #4a0e2c;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--deep);
  }

  /* ===== Animated luxury background ===== */
  .scene {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255, 77, 141, 0.45) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 80%, rgba(184, 134, 11, 0.40) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(255, 105, 180, 0.30) 0%, transparent 60%),
      linear-gradient(135deg, #2a0a1f 0%, #4a0e2c 40%, #6b1439 70%, #2a0a1f 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 100% 100%;
    animation: bgShift 18s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 0%, 100% 100%, 50% 50%, 0 0; }
    50%      { background-position: 100% 100%, 0% 0%, 50% 50%, 0 0; }
  }

  /* Gold shimmer overlay */
  .shimmer {
    position: fixed;
    inset: 0;
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255, 215, 0, 0.08) 45%,
      rgba(255, 255, 255, 0.12) 50%,
      rgba(255, 215, 0, 0.08) 55%,
      transparent 70%);
    background-size: 250% 250%;
    animation: shimmerMove 8s linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes shimmerMove {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Floating gold dust particles */
  .dust {
    position: fixed;
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--gold), 0 0 16px rgba(255,215,0,0.6);
    pointer-events: none;
    z-index: 2;
    animation: dustFloat linear infinite;
  }
  @keyframes dustFloat {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-110vh) translateX(var(--dx, 30px)); opacity: 0; }
  }

  /* Background hearts (rose) */
  .bg-heart {
    position: fixed;
    color: rgba(255, 105, 140, 0.30);
    font-size: 26px;
    pointer-events: none;
    user-select: none;
    z-index: 2;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* Vignette */
  .vignette {
    position: fixed;
    inset: 0;
    box-shadow: inset 0 0 200px rgba(0,0,0,0.7);
    pointer-events: none;
    z-index: 3;
  }

  /* ============ PREMIUM LOCK SCREEN ============ */
  .lock-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .lock-screen.hide {
    opacity: 0;
    transform: scale(1.15);
    pointer-events: none;
  }

  .lock-card {
    position: relative;
    padding: 50px 60px 40px;
    border-radius: 28px;
    background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid rgba(255, 215, 0, 0.4);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      0 0 60px rgba(255, 77, 141, 0.3),
      inset 0 1px 0 rgba(255,255,255,0.15);
    text-align: center;
    animation: cardFloat 4s ease-in-out infinite;
  }
  @keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .lock-eyebrow {
    font-size: 12px;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
    font-family: 'Georgia', serif;
    text-shadow: 0 0 10px rgba(255,215,0,0.6);
  }
  .lock-title {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: bold;
    color: #fff;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, #ffd1dc 50%, #ffd700 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-family: 'Georgia', serif;
    letter-spacing: 1px;
  }
  .lock-sub {
    font-size: 14px;
    color: rgba(255, 209, 220, 0.8);
    font-style: italic;
    margin-bottom: 30px;
    font-family: 'Georgia', serif;
  }

  /* The golden lock */
  .lock-icon {
    width: 100px;
    height: 110px;
    margin: 0 auto 30px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .lock-icon:hover { transform: scale(1.08); }
  .lock-icon.shake { animation: shake 0.5s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-3deg); }
    40% { transform: translateX(8px) rotate(3deg); }
    60% { transform: translateX(-6px) rotate(-2deg); }
    80% { transform: translateX(6px) rotate(2deg); }
  }
  .lock-shackle {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border: 9px solid var(--gold);
    border-bottom: none;
    border-radius: 28px 28px 0 0;
    box-shadow:
      0 0 18px rgba(255,215,0,0.7),
      inset 0 2px 4px rgba(255,255,255,0.4);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s;
    transform-origin: left bottom;
  }
  .lock-icon.unlocked .lock-shackle {
    transform: translateX(-50%) rotate(-100deg) translateY(-6px);
  }
  .lock-body {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 65px;
    background: linear-gradient(145deg, var(--gold), var(--gold-deep));
    border-radius: 12px;
    box-shadow:
      0 0 20px rgba(255,215,0,0.5),
      inset 0 -6px 0 rgba(0,0,0,0.25),
      inset 0 2px 0 rgba(255,255,255,0.4);
  }
  .lock-keyhole {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: var(--deep);
    border-radius: 50%;
    box-shadow: 0 6px 0 -2px var(--deep);
  }

  .lock-hint {
    font-size: 13px;
    color: rgba(255, 215, 0, 0.85);
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: blink 1.5s ease-in-out infinite;
    font-family: 'Georgia', serif;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  /* Sparkles around lock when unlocked */
  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--gold), 0 0 20px #fff;
    pointer-events: none;
    animation: sparkFly 1s ease-out forwards;
  }
  @keyframes sparkFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  }

  /* ============ MAIN SURPRISE ============ */
  .main-stage {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 10;
    opacity: 0;
    transition: opacity 1s ease 0.3s;
  }
  .main-stage.show { opacity: 1; }

  /* Faiza name — premium gold-pink gradient */
  .name-wrap {
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
  }
  .faiza-name {
    font-size: clamp(48px, 9vw, 96px);
    font-weight: bold;
    background: linear-gradient(135deg, #ffd700 0%, #fff 30%, #ff85a1 60%, #ffd700 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    font-family: 'Georgia', serif;
    animation: nameShine 4s ease-in-out infinite, namePulse 2.5s ease-in-out infinite;
    display: inline-block;
    filter: drop-shadow(0 4px 12px rgba(255,215,0,0.4));
  }
  @keyframes nameShine {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  @keyframes namePulse {
    0%, 100% { transform: scale(1) rotate(-1deg); }
    50%      { transform: scale(1.06) rotate(1deg); }
  }
  .name-sub {
    font-size: clamp(13px, 2vw, 18px);
    color: var(--gold);
    margin-top: 6px;
    font-style: italic;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
    font-family: 'Georgia', serif;
  }

  /* Start button — premium gold */
  .start-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 22px 60px;
    font-size: clamp(20px, 3.5vw, 28px);
    font-weight: bold;
    color: var(--deep);
    background: linear-gradient(135deg, #fff8c4 0%, var(--gold) 40%, var(--gold-deep) 100%);
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 50px;
    cursor: pointer;
    box-shadow:
      0 12px 35px rgba(255, 215, 0, 0.5),
      0 0 40px rgba(255, 77, 141, 0.4),
      inset 0 -4px 0 rgba(0,0,0,0.2),
      inset 0 2px 0 rgba(255,255,255,0.5);
    letter-spacing: 2px;
    z-index: 10;
    font-family: 'Georgia', serif;
    animation: btnGlow 2s ease-in-out infinite;
    transition: transform 0.2s ease;
  }
  @keyframes btnGlow {
    0%, 100% {
      box-shadow: 0 12px 35px rgba(255, 215, 0, 0.5),
                  0 0 40px rgba(255, 77, 141, 0.4),
                  inset 0 -4px 0 rgba(0,0,0,0.2),
                  inset 0 2px 0 rgba(255,255,255,0.5);
    }
    50% {
      box-shadow: 0 12px 45px rgba(255, 215, 0, 0.8),
                  0 0 70px rgba(255, 77, 141, 0.6),
                  inset 0 -4px 0 rgba(0,0,0,0.2),
                  inset 0 2px 0 rgba(255,255,255,0.5);
    }
  }
  .start-btn:hover { transform: translate(-50%, -50%) scale(1.06); }
  .start-btn:active { transform: translate(-50%, -50%) scale(0.95); }
  .start-btn.hide {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.5);
    transition: all 0.4s ease;
  }

  /* Ground */
  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: linear-gradient(180deg, rgba(255, 77, 141, 0.2), rgba(255, 77, 141, 0.5));
    border-top: 2px solid rgba(255, 215, 0, 0.5);
    box-shadow: 0 -10px 30px rgba(255, 215, 0, 0.15);
    z-index: 1;
  }

  /* Child */
  .child {
    position: absolute;
    bottom: 80px;
    left: -180px;
    width: 120px;
    height: 180px;
    z-index: 4;
    animation: childWalk 4s ease-in forwards;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
  }
  @keyframes childWalk {
    0%   { left: -180px; }
    55%  { left: calc(50% - 60px); }
    70%  { left: calc(50% - 60px); }
    100% { left: 110%; }
  }
  .child .body { animation: childBob 0.4s ease-in-out infinite; }
  @keyframes childBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  /* Owl */
  .owl {
    position: absolute;
    bottom: 110px;
    left: -180px;
    font-size: 50px;
    z-index: 5;
    animation: owlCarry 4s ease-in forwards;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
  }
  @keyframes owlCarry {
    0%   { left: -180px; bottom: 110px; transform: rotate(0deg) scale(1); }
    55%  { left: calc(50% - 60px); bottom: 130px; transform: rotate(0deg) scale(1); }
    70%  { left: calc(50% - 60px); bottom: 130px; transform: rotate(0deg) scale(1); }
    78%  { left: 45%; bottom: 200px; transform: rotate(-30deg) scale(1.1); }
    100% { left: 60%; bottom: 90vh; transform: rotate(720deg) scale(0.4); opacity: 0; }
  }

  /* Gift box — premium gold ribbon */
  .gift {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 140px;
    height: 140px;
    z-index: 6;
    opacity: 0;
    transition: opacity 0.4s ease;
    filter: drop-shadow(0 8px 15px rgba(0,0,0,0.5));
  }
  .gift.show { opacity: 1; }
  .gift.pop { animation: giftPop 0.5s ease-out forwards; }
  @keyframes giftPop {
    0%   { transform: translateX(-50%) scale(0) rotate(-20deg); }
    60%  { transform: translateX(-50%) scale(1.2) rotate(10deg); }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); }
  }
  .gift .box-base {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 140px;
    height: 110px;
    background: linear-gradient(135deg, #ff4d8d, #ff85a1);
    border-radius: 8px;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.3);
  }
  .gift .ribbon-v {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 110px;
    background: linear-gradient(180deg, #ffe97a, var(--gold-deep));
    box-shadow: inset -3px 0 0 rgba(0,0,0,0.2), 0 0 8px rgba(255,215,0,0.5);
  }
  .gift .ribbon-h {
    position: absolute;
    bottom: 44px;
    left: 0;
    width: 140px;
    height: 22px;
    background: linear-gradient(90deg, #ffe97a, var(--gold-deep));
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), 0 0 8px rgba(255,215,0,0.5);
  }
  .gift .lid {
    position: absolute;
    top: 0;
    left: -8px;
    width: 156px;
    height: 40px;
    background: linear-gradient(135deg, #ff4d8d, #ff85a1);
    border-radius: 8px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.3);
    transform-origin: left center;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
    z-index: 2;
  }
  .gift .lid .ribbon-v-lid {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 40px;
    background: linear-gradient(180deg, #ffe97a, var(--gold-deep));
  }
  .gift .bow {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 36px;
    z-index: 3;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }
  .gift.open .lid {
    transform: rotate(-110deg) translate(-20px, -10px);
    opacity: 0.6;
  }

  /* Burst love emojis */
  .burst {
    position: absolute;
    bottom: 150px;
    left: 50%;
    font-size: 36px;
    pointer-events: none;
    z-index: 7;
    animation: burstFly 2.5s ease-out forwards;
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
  }
  @keyframes burstFly {
    0%   { transform: translate(0,0) scale(0); opacity: 1; }
    20%  { transform: translate(var(--tx), var(--ty)) scale(1.3); opacity: 1; }
    100% { transform: translate(calc(var(--tx) * 2), calc(var(--ty) * 2 - 200px)) scale(0.6); opacity: 0; }
  }

  /* Final love message — premium gold */
  .love-msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    text-align: center;
    z-index: 8;
    opacity: 0;
    pointer-events: none;
  }
  .love-msg.show { animation: msgPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes msgPop {
    0%   { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
    60%  { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
  }
  .love-msg .main-text {
    font-size: clamp(34px, 6.5vw, 68px);
    font-weight: bold;
    background: linear-gradient(135deg, #ffd700 0%, #fff 40%, #ff85a1 70%, #ffd700 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    font-family: 'Georgia', serif;
    animation: msgShine 3s ease-in-out infinite, msgHeart 1.5s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.6));
  }
  @keyframes msgShine {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  @keyframes msgHeart {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  .love-msg .heart-icon {
    font-size: clamp(44px, 7.5vw, 76px);
    display: inline-block;
    animation: heartBeat 0.9s ease-in-out infinite;
    filter: drop-shadow(0 0 15px rgba(255, 77, 141, 0.8));
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.25); }
    50%      { transform: scale(0.95); }
    75%      { transform: scale(1.15); }
  }
  .love-msg .signature {
    margin-top: 14px;
    font-size: clamp(14px, 2.2vw, 18px);
    color: rgba(255, 215, 0, 0.9);
    letter-spacing: 5px;
    text-transform: uppercase;
    font-style: italic;
    font-family: 'Georgia', serif;
  }

  /* Confetti hearts */
  .confetti {
    position: absolute;
    top: -40px;
    font-size: 24px;
    pointer-events: none;
    z-index: 9;
    animation: confettiFall linear forwards;
    filter: drop-shadow(0 0 4px rgba(255,215,0,0.6));
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }

  /* Replay */
  .replay-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: bold;
    color: var(--gold);
    background: rgba(42, 10, 31, 0.7);
    backdrop-filter: blur(8px);
    border: 1.5px solid var(--gold);
    border-radius: 30px;
    cursor: pointer;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    letter-spacing: 2px;
    font-family: 'Georgia', serif;
    text-transform: uppercase;
  }
  .replay-btn.show { opacity: 1; pointer-events: auto; }
  .replay-btn:hover {
    background: var(--gold);
    color: var(--deep);
    box-shadow: 0 0 20px rgba(255,215,0,0.6);
  }

  @media (max-width: 600px) {
    .lock-card { padding: 35px 35px 28px; margin: 0 20px; }
    .child { width: 90px; height: 140px; }
    .owl { font-size: 40px; }
    .gift { width: 110px; height: 110px; }
    .gift .box-base { width: 110px; height: 86px; }
    .gift .ribbon-v { height: 86px; }
    .gift .ribbon-h { bottom: 32px; width: 110px; }
    .gift .lid { width: 124px; left: -7px; }
  }
</style>
</head>
<body>

  <!-- Luxury scene -->
  <div class="scene"></div>
  <div class="shimmer"></div>
  <div class="vignette"></div>
  <div id="bgHearts"></div>
  <div id="dust"></div>

  <!-- ============ PREMIUM LOCK SCREEN ============ -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="lock-eyebrow">✦ Exclusive ✦</div>
      <div class="lock-title">A Gift For Faiza</div>
      <div class="lock-sub">— sealed with love —</div>

      <div class="lock-icon" id="lockIcon" title="Tap to unlock">
        <div class="lock-shackle"></div>
        <div class="lock-body">
          <div class="lock-keyhole"></div>
        </div>
      </div>

      <div class="lock-hint">✦ Tap the lock to unlock ✦</div>
    </div>
  </div>

  <!-- ============ MAIN SURPRISE STAGE ============ -->
  <div class="main-stage" id="mainStage">

    <!-- Faiza name -->
    <div class="name-wrap">
      <div class="faiza-name">Faiza</div>
      <div class="name-sub">My Beloved</div>
    </div>

    <!-- Start button -->
    <button class="start-btn" id="startBtn">✦ Open The Surprise ✦</button>

    <!-- Ground -->
    <div class="ground"></div>

    <!-- Child -->
    <div class="child" id="child">
      <svg class="body" viewBox="0 0 120 180" width="120" height="180" xmlns="http://www.w3.org/2000/svg">
        <rect x="42" y="130" width="14" height="45" rx="6" fill="#5b8def"/>
        <rect x="64" y="130" width="14" height="45" rx="6" fill="#5b8def"/>
        <ellipse cx="49" cy="178" rx="11" ry="6" fill="#222"/>
        <ellipse cx="71" cy="178" rx="11" ry="6" fill="#222"/>
        <path d="M35 80 Q60 70 85 80 L90 135 Q60 145 30 135 Z" fill="#ff4d8d"/>
        <circle cx="60" cy="105" r="6" fill="#ffd700"/>
        <rect x="22" y="85" width="12" height="40" rx="6" fill="#ffd1a8"/>
        <rect x="86" y="85" width="12" height="40" rx="6" fill="#ffd1a8"/>
        <circle cx="92" cy="80" r="8" fill="#ffd1a8"/>
        <circle cx="60" cy="50" r="28" fill="#ffd1a8"/>
        <path d="M32 45 Q40 18 60 18 Q80 18 88 45 Q85 30 60 28 Q35 30 32 45 Z" fill="#5d3a1a"/>
        <circle cx="50" cy="50" r="3.5" fill="#222"/>
        <circle cx="70" cy="50" r="3.5" fill="#222"/>
        <circle cx="51" cy="49" r="1" fill="#fff"/>
        <circle cx="71" cy="49" r="1" fill="#fff"/>
        <circle cx="44" cy="58" r="4" fill="#ff9eb5" opacity="0.7"/>
        <circle cx="76" cy="58" r="4" fill="#ff9eb5" opacity="0.7"/>
        <path d="M52 62 Q60 70 68 62" stroke="#c2185b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Owl -->
    <div class="owl" id="owl">🦉</div>

    <!-- Gift box -->
    <div class="gift" id="gift">
      <div class="bow">🎀</div>
      <div class="lid"><div class="ribbon-v-lid"></div></div>
      <div class="box-base"></div>
      <div class="ribbon-h"></div>
      <div class="ribbon-v"></div>
    </div>

    <!-- Final love message -->
    <div class="love-msg" id="loveMsg">
      <div class="main-text">I Love You Faiza</div>
      <div style="margin-top:10px;"><span class="heart-icon">💖</span></div>
      <div class="signature">— Forever Yours —</div>
    </div>

    <!-- Replay -->
    <button class="replay-btn" id="replayBtn">↺ Replay</button>
  </div>

<script>
  const lockScreen = document.getElementById('lockScreen');
  const lockIcon   = document.getElementById('lockIcon');
  const mainStage  = document.getElementById('mainStage');
  const startBtn   = document.getElementById('startBtn');
  const replayBtn  = document.getElementById('replayBtn');
  const child      = document.getElementById('child');
  const owl        = document.getElementById('owl');
  const gift       = document.getElementById('gift');
  const loveMsg    = document.getElementById('loveMsg');
  const bgHearts   = document.getElementById('bgHearts');
  const dustBox    = document.getElementById('dust');

  const heartEmojis = ['💖','💕','💗','💓','❤️','💘','💝','💞','🩷','😍','✨'];

  /* === Background floating hearts === */
  function spawnBgHeart() {
    const h = document.createElement('div');
    h.className = 'bg-heart';
    h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (20 + Math.random()*30) + 'px';
    h.style.animationDuration = (6 + Math.random()*6) + 's';
    h.style.animationDelay = Math.random()*2 + 's';
    bgHearts.appendChild(h);
    setTimeout(() => h.remove(), 14000);
  }
  setInterval(spawnBgHeart, 700);
  for (let i=0;i<10;i++) setTimeout(spawnBgHeart, i*200);

  /* === Gold dust particles === */
  function spawnDust() {
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.top = '110vh';
    d.style.setProperty('--dx', (Math.random()*100 - 50) + 'px');
    d.style.animationDuration = (8 + Math.random()*6) + 's';
    const sz = 2 + Math.random()*4;
    d.style.width = sz + 'px';
    d.style.height = sz + 'px';
    dustBox.appendChild(d);
    setTimeout(() => d.remove(), 16000);
  }
  setInterval(spawnDust, 350);
  for (let i=0;i<15;i++) setTimeout(spawnDust, i*150);

  /* === Premium lock unlock === */
  function unlockEffect() {
    lockIcon.classList.add('unlocked');
    // spawn sparkles
    const rect = lockIcon.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    for (let i=0;i<30;i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = cx + 'px';
      s.style.top  = cy + 'px';
      const ang = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random()*120;
      s.style.setProperty('--sx', Math.cos(ang)*dist + 'px');
      s.style.setProperty('--sy', Math.sin(ang)*dist + 'px');
      s.style.animationDuration = (0.6 + Math.random()*0.6) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1300);
    }
    setTimeout(() => {
      lockScreen.classList.add('hide');
      mainStage.classList.add('show');
    }, 900);
  }

  lockIcon.addEventListener('click', () => {
    lockIcon.classList.add('shake');
    setTimeout(() => {
      lockIcon.classList.remove('shake');
      unlockEffect();
    }, 500);
  });
  lockIcon.addEventListener('touchstart', (e) => {
    e.preventDefault();
    lockIcon.classList.add('shake');
    setTimeout(() => {
      lockIcon.classList.remove('shake');
      unlockEffect();
    }, 500);
  }, {passive:false});

  /* === Main surprise sequence === */
  function runSequence() {
    startBtn.classList.add('hide');

    child.style.animation = 'none';
    owl.style.animation   = 'none';
    gift.classList.remove('show','pop','open');
    loveMsg.classList.remove('show');
    void child.offsetWidth;
    void owl.offsetWidth;
    child.style.animation = 'childWalk 4s ease-in forwards';
    owl.style.animation   = 'owlCarry 4s ease-in forwards';

    setTimeout(() => { gift.classList.add('show','pop'); }, 2800);
    setTimeout(() => { gift.classList.add('open'); burstEmojis(); }, 3600);
    setTimeout(() => {
      loveMsg.classList.add('show');
      confettiRain();
      replayBtn.classList.add('show');
    }, 4200);
  }

  function burstEmojis() {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight - 230;
    for (let i=0;i<28;i++) {
      const e = document.createElement('div');
      e.className = 'burst';
      e.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
      e.style.left = cx + 'px';
      e.style.top  = cy + 'px';
      const angle = (Math.PI * 2 * i) / 28 + Math.random()*0.3;
      const dist  = 120 + Math.random()*140;
      e.style.setProperty('--tx', Math.cos(angle)*dist + 'px');
      e.style.setProperty('--ty', Math.sin(angle)*dist - 80 + 'px');
      e.style.fontSize = (28 + Math.random()*24) + 'px';
      e.style.animationDuration = (2 + Math.random()) + 's';
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 3000);
    }
  }

  function confettiRain() {
    for (let i=0;i<50;i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = (16 + Math.random()*24) + 'px';
      c.style.animationDuration = (3 + Math.random()*3) + 's';
      c.style.animationDelay = Math.random()*2 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 8000);
    }
  }

  function resetAll() {
    replayBtn.classList.remove('show');
    loveMsg.classList.remove('show');
    gift.classList.remove('show','pop','open');
    child.style.animation = 'none';
    owl.style.animation   = 'none';
    document.querySelectorAll('.burst,.confetti').forEach(el => el.remove());
    startBtn.classList.remove('hide');
  }

  startBtn.addEventListener('click', runSequence);
  startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); runSequence(); }, {passive:false});

  replayBtn.addEventListener('click', () => {
    resetAll();
    setTimeout(runSequence, 200);
  });
</script>
</body>
</html>
